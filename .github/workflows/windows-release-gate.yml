name: windows-talking-webfix-gate

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Local hotfix candidate identity
        required: true
        type: string
      baseline_sha256:
        description: Published v1.8.3-rc.3 Windows first-install SHA-256
        required: true
        type: string
      jewelry_upgrade_sha256:
        description: Published jewelry v0.5.0 Windows upgrade SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-talking-webfix-gate:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      AICW_TALKING_WEBFIX_BASELINE_URL: ${{ secrets.AICW_TALKING_WEBFIX_V5_BASELINE_URL }}
      AICW_TALKING_WEBFIX_JEWELRY_URL: ${{ secrets.AICW_TALKING_WEBFIX_V5_JEWELRY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare browser and local media tools
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'talking-web-path-test-dependencies'
          New-Item -ItemType Directory -Path $deps | Out-Null
          Set-Content -LiteralPath (Join-Path $deps 'package.json') -Value '{"private":true}'
          & npm.cmd install --prefix $deps --ignore-scripts --no-audit --no-fund @playwright/test@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser harness dependency installation failed.' }
          & node.exe (Join-Path $deps 'node_modules\playwright\cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Test browser installation failed.' }
          & choco.exe install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Media tools installation failed.' }
          "AICW_TEST_DEPENDENCIES_FOLDER=$deps" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run v1.8.3 baseline compatibility matrix
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AICW_TALKING_WEBFIX_BASELINE_URL) -or
              [string]::IsNullOrWhiteSpace($env:AICW_TALKING_WEBFIX_JEWELRY_URL)) {
            throw 'Validation package secrets are not configured.'
          }
          & .\scripts\run_windows_talking_webfix_gate.ps1 `
            -CandidateId '${{ inputs.candidate_id }}' `
            -BaselineUrl $env:AICW_TALKING_WEBFIX_BASELINE_URL `
            -BaselineSha256 '${{ inputs.baseline_sha256 }}' `
            -JewelryUpgradeUrl $env:AICW_TALKING_WEBFIX_JEWELRY_URL `
            -JewelryUpgradeSha256 '${{ inputs.jewelry_upgrade_sha256 }}' `
            -OutputRoot "$env:RUNNER_TEMP\aicw-windows-talking-webfix-gate"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-talking-webfix-${{ inputs.candidate_id }}
          path: |
            ${{ runner.temp }}\aicw-windows-talking-webfix-gate\windows-talking-webfix-gate.json
            ${{ runner.temp }}\aicw-windows-talking-webfix-gate\evidence
          if-no-files-found: warn
          retention-days: 7
